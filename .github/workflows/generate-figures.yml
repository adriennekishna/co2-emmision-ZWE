name: Generate Zimbabwe CO2 figures

on:
  push:
    branches: [main]
    paths:
      - "zimbabwe_co2_analysis.R"
      - ".github/workflows/generate-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        run: |
          Rscript -e 'install.packages(c("tidyverse", "scales"), repos = "https://cloud.r-project.org")'

      - name: Run Zimbabwe CO2 analysis
        run: Rscript zimbabwe_co2_analysis.R

      - name: Commit generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Zimbabwe CO2 analysis figures"
            git push
          else
            echo "No figure changes to commit."
          fi
