name: Generate Zimbabwe CO2 figures

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_co2.R"
      - ".github/workflows/generate-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run Zimbabwe CO2 analysis
        run: Rscript scripts/analyze_co2.R

      - name: Commit generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/*.png data/ZWE_co2.csv results/*.csv results/session_info.txt
          if ! git diff --cached --quiet; then
            git commit -m "Generate Zimbabwe CO2 analysis figures"
            git push
          else
            echo "No generated-file changes to commit."
          fi
